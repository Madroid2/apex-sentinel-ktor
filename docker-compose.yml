services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel-local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - sentinel-postgres:/var/lib/postgresql/data

  sentinel:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SENTINEL_ENV: development
      SENTINEL_STORAGE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinel
      DATABASE_USER: sentinel
      DATABASE_PASSWORD: sentinel-local-only
      SENTINEL_API_KEYS: apex:dev-apex-key
      SENTINEL_ADMIN_KEY: dev-admin-key
    ports:
      - "8080:8080"

volumes:
  sentinel-postgres:
